<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Mon voyage — Transbora</title>
<link rel="stylesheet" href="./choice-pages.css">

<body><header class="top"><div class="shell"><a class="logo" href="./index.html">🚆 Transbora</a><span>Choix des horaires</span></div></header>
<main class="shell">
 <div class="lead"><span class="tag">MON DÉPLACEMENT</span><h1 id="event-title">Chargement…</h1>
 <p id="event-meta"></p></div>
 <div class="alert" role="status" id="status">Ouverture des propositions…</div>
 <form id="choice-form" hidden>
  <div id="people"></div>
  <button id="save" class="main-button" type="submit">✓ Confirmer mes choix</button>
 </form>
 <section id="success" class="success" hidden tabindex="-1"><h2>Choix enregistrés !</h2>
 <p>L'organisateur pourra maintenant préparer les réservations.</p>
 <p><strong>Aucun billet n'a été acheté.</strong></p>
 <button id="edit" type="button" class="link-button">Modifier mes choix</button></section>
 <p class="footnote">Horaires proposés à titre indicatif. Vérifiez avec l'organisateur avant toute réservation.</p>
</main>
</body></html>

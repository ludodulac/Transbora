<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Retrouvez vos événements Transbora et les réponses des voyageurs.">
<title>Liens de suivi — Transbora</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./events.css">
<script type="module" src="./mes-evenements.mjs"></script>
</head>
<body>
<header class="event-header"><div class="container event-nav">
<a class="brand" href="./organisation.html">🚆 Transbora</a>
<a class="header-link" href="./organisation.html">← Tableau de bord</a>
</div></header>
<main class="container event-main history-main">
 <section class="panel event-panel">
  <div class="screen-heading"><h1>Liens de suivi</h1></div>
  <p class="small">Retrouvez ici les liens de réponses envoyés aux artistes depuis cet appareil.</p>
  <p id="history-feedback" class="inline-feedback" role="status"></p>
  <div id="history-list" class="history-list" aria-live="polite"></div>

 </section>
 <details class="settings-fold history-recover">
  <summary>Retrouver un lien de suivi</summary>
  <p>Collez ici le lien privé de suivi.</p>
  <form id="history-import"><label>Lien de suivi
    <input type="url" id="history-link" required>
    </label><button type="submit" class="secondary">Retrouver mon dossier</button></form>
 </details>
 <p class="history-privacy">Ces liens sont conservés sur cet appareil. Gardez une copie des liens privés.</p>
</main>
</body></html>

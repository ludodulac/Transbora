name: Transbora - tests hors ligne
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.mjs
      - run: node --check site/app-multi.mjs

  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test des vrais flux GTFS publics
        run: python scripts/build_sources.py --output site/data
      - name: Construire le référentiel SNCF PRR de correspondances
        run: python scripts/build_mct.py --output site/data/mct.json
      - name: Rapport de couverture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('site/data/manifest.json').read_text())
          for src in manifest['sources']:
              print(src['label'],src['status'],src.get('trips',0),
                    src.get('first',''),src.get('last',''),src.get('message',''))
          assert manifest['sources'][0]['status']=='ok'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recherche reelle Lorient Paris (controle indicatif)
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {searchFeed} from './site/search-multi.mjs';
          const data=JSON.parse(fs.readFileSync('site/data/sncf.json','utf8'));
          const source={id:'sncf',label:'SNCF Voyageurs',mode:'rail'};
          const results=searchFeed(data,{
            from:'Lorient',to:'Paris',date:'2026-11-25',
            earliest:'00:00',latest:'23:59'
          },source);
          console.log('Lorient -> Paris 25/11/2026:',results.length,'trains directs');
          console.log(results.slice(0,3).map(r=>[r.from,r.to,r.departure,r.arrival]));
          if(!results.length)throw new Error('Aucun train direct Lorient-Paris, vérifier le moteur de recherche');
          JS
      - name: Tester une vraie recherche avec correspondance
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {findConnections} from './site/connections.mjs';
          const manifest=JSON.parse(fs.readFileSync('site/data/manifest.json','utf8'));
          const feeds=manifest.sources.filter(s=>s.status==='ok').map(source=>({
            source,data:JSON.parse(fs.readFileSync('site/'+source.file,'utf8'))
          }));
          console.log('Fuseaux et coordonnées par source:');
          for(const f of feeds){
            const located=f.data.stations.filter(s=>Number.isFinite(s[2])&&Number.isFinite(s[3])).length;
            console.log(f.source.label, f.data.meta.timezone,located,'gares coordonnées /',f.data.stations.length,
              'restrictions de correspondances:',f.data.transfers?.length||0);
          }
          for(const [from,to] of [['Lorient','Bordeaux'],['Brest','Lyon']]){
            const result=findConnections(feeds,{
              from,to,date:'2026-11-25',earliest:'00:00',latest:'23:59'
            },{limit:10,profile:'prudent'});
            console.log('Correspondances réelles',from,'->',to,':',result.length);
            console.log(result.slice(0,3).map(x=>({
              from:x.from,to:x.to,departure:x.departure,arrival:x.arrival,
              transfer:x.transfer.station,waiting:x.transfer.waitingSeconds,
              min:x.transfer.minimumSeconds,
              operators:x.legs.map(l=>l.provider)
            })));
          }
          JS
      - name: Tester deux vraies correspondances en recherche multimodale
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {findTwoChanges} from './site/connections-two.mjs';
          import {officialIndex} from './site/connections.mjs';
          const m=JSON.parse(fs.readFileSync('site/data/manifest.json','utf8'));
          const rules=officialIndex(JSON.parse(fs.readFileSync('site/data/mct.json','utf8')));
          console.log('Règles SNCF spécifiques officiellement téléchargées :',rules.size);
          const feeds=m.sources.filter(x=>x.status==='ok').map(source=>({
            source,data:JSON.parse(fs.readFileSync('site/'+source.file,'utf8'))
          }));
          const start=Date.now();
          const routes=findTwoChanges(feeds,{from:'Brest',to:'Strasbourg',date:'2026-11-25',
            earliest:'05:00',latest:'23:59'},{profile:'very_cautious',officialRules:rules,limit:6});
          console.log('Temps de calcul en ms :',Date.now()-start);
          console.log('Itinéraires trouvés à deux correspondances :',routes.length);
          console.log(routes.slice(0,2).map(r=>({dep:r.departure,arr:r.arrival,
            via:r.transfers.map(t=>[t.station,t.waitingSeconds,t.minimumSeconds])})));
          if(!routes.length)throw new Error('Absence inattendue de trajet réel à deux correspondances');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-validation
          path: site/data/manifest.json
          if-no-files-found: ignore

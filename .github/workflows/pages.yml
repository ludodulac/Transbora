name: Transbora - horaires multimodaux et publication
on:
  push:
    branches: [main]
  schedule:
    - cron: '34 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transbora-pages
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du moteur de donnees
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Tests de recherche dans le navigateur
        run: node --test tests/*.test.mjs
      - name: Telecharger les horaires des cinq transporteurs
        run: python scripts/build_sources.py --output site/data
      - name: Verifier le fichier genere
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('site/data/manifest.json').read_text())
          assert manifest['available'] >= 1
          assert manifest['sources'][0]['id'] == 'sncf'
          assert manifest['sources'][0]['status'] == 'ok'
          data = json.loads(Path('site/data/sncf.json').read_text())
          assert len(data['trips']) > 100
          assert len(data['stations']) > 100
          assert data['meta']['first'] <= data['meta']['last']
          print('Sources :', [(s['id'],s['status']) for s in manifest['sources']])
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publier le site
        uses: actions/deploy-pages@v4
        id: deployment

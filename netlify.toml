[build]
  command = "python3 scripts/build_sources.py --output site/data && python3 scripts/build_mct.py --output site/data/mct.json --allow-unavailable"
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/choix.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/suivi.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
